[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hepdata-mcp"
version = "0.1.0"
description = "An MCP server for discovering and retrieving HEPData records."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Mohamed Elashri", email = "mohamed.elashri@cern.ch" },
]
maintainers = [
  { name = "Mohamed Elashri", email = "mohamed.elashri@cern.ch" },
]
keywords = [
  "hepdata",
  "mcp",
  "model-context-protocol",
  "high-energy-physics",
  "particle-physics",
  "datasets",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1",
  "mcp[cli]>=1.27.0,<2",
  "pydantic>=2.13.3",
]

[project.urls]
Homepage = "https://www.hepdata.net/"
Documentation = "https://github.com/HEPData/hepdata-mcp#readme"
Repository = "https://github.com/HEPData/hepdata-mcp"
Issues = "https://github.com/HEPData/hepdata-mcp/issues"

[project.scripts]
hepdata-mcp = "hepdata_mcp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.20.2",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "respx>=0.23.1",
  "ruff>=0.15.12",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/hepdata_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
